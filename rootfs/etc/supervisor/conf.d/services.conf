; All services of the former VM in one container. Output goes to `docker logs <container>`.
; Control: docker exec <container> supervisorctl status | restart nginx | signal USR2 php-fpm
; Lower priority starts first and stops last.

[program:mariadb]
command=/usr/sbin/mariadbd --user=mysql --innodb-buffer-pool-size=%(ENV_DB_BUFFER_POOL)s --sql-mode=%(ENV_DB_SQL_MODE)s
priority=10
; A hard kill can corrupt MyISAM tables, so give MariaDB time to shut down cleanly.
stopwaitsecs=90
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --dir /var/lib/redis --daemonize no
user=redis
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:memcached]
command=/usr/bin/memcached -u memcache -l 127.0.0.1 -p 11211 -m 128
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:beanstalkd]
command=/usr/bin/beanstalkd -l 127.0.0.1 -p 11300
user=beanstalkd
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mailpit]
command=/usr/local/bin/mailpit --listen 0.0.0.0:8025 --smtp 0.0.0.0:1025 --quiet
user=nobody
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
