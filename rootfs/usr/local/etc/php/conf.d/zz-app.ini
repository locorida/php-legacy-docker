; Development defaults on top of php.ini-production. ${VAR} values come from the container
; environment (see .env.example); their defaults are set in the Dockerfile.
memory_limit = 1024M
max_execution_time = 300
post_max_size = 64M
upload_max_filesize = 64M
max_input_vars = 10000
date.timezone = ${TZ}

log_errors = On
display_errors = Off
error_log = /proc/self/fd/2

; Sessions in memcached, as many classic multi-server PHP setups do.
session.save_handler = memcached
session.save_path = "127.0.0.1:11211"

; Mail goes to Mailpit; nothing ever leaves the container.
sendmail_path = "/usr/local/bin/mailpit sendmail -S 127.0.0.1:1025"

; Set OPCACHE_VALIDATE_TIMESTAMPS=0 for code on slow Windows bind mounts and run the watcher
; (up.ps1 -Watch), which reloads PHP-FPM on every change. See README, "Performance".
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = ${OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000
realpath_cache_size = 16M
realpath_cache_ttl = 600

; XDEBUG_MODE (off | debug | develop | coverage) is read by Xdebug directly from the environment.
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.start_with_request = trigger
